name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    name: Build Signed Stable Release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 14
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '14'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Generate signing key
        run: |
          set -e
          KEY_STORE_PASSWORD=$(openssl rand -hex 12)
          ALIAS="ciupload"

          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/key.jks" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEY_STORE_PASSWORD" \
            -keypass "$KEY_STORE_PASSWORD" \
            -dname "CN=CI Build, OU=CI, O=CI, L=CI, S=CI, C=US"

          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/key.jks
          storePassword=$KEY_STORE_PASSWORD
          keyAlias=$ALIAS
          keyPassword=$KEY_STORE_PASSWORD
          EOF
      - name: Verify signing key readable
        run: |
          set -e
          source_props() {
            grep "^$1=" "$GITHUB_WORKSPACE/keystore.properties" | cut -d= -f2-
          }
          STOREPASS=$(source_props storePassword)
          KEYALIAS=$(source_props keyAlias)
          keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/key.jks" \
            -alias "$KEYALIAS" \
            -storepass "$STOREPASS" > /dev/null
          echo "Keystore OK: alias $KEYALIAS is readable with the given passwords."
      - name: Build signed Stable Release APK
        run: ./gradlew clean assembleStstableRelease --stacktrace
      - name: Find generated APK
        run: |
          echo "Generated APK:"
          find smarttubetv/build/outputs/apk -type f -name "*.apk" -print
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: litetube-stable-release
          path: smarttubetv/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Delete signing key
        if: always()
        run: rm -f key.jks keystore.properties
