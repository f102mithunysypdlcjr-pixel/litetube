name: Build Debug APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          # Tag the build so "Settings > About" on-device shows exactly which CI run it came from
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-debug-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Configure Build Signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks
          # Optional: only needed to sign this debug APK with the same key as a real release,
          # so it can overwrite-install over one. If SIGNING_KEY isn't set, this step is
          # skipped entirely and the debug build falls back to Android's default debug
          # keystore automatically -- still fully installable, no secrets required.

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Lint with Gradle
        run: ./gradlew lintStbetaDebug

      - name: Upload Lint Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      - name: Build Debug APK
        run: ./gradlew clean assembleStbetaDebug

      - name: Upload ARMv7 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LiteTube_${{ steps.get_version.outputs.VERSION_NAME }}_armeabi-v7a_debug
          path: ./smarttubetv/build/outputs/apk/stbeta/debug/*_armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LiteTube_${{ steps.get_version.outputs.VERSION_NAME }}_universal_debug
          path: ./smarttubetv/build/outputs/apk/stbeta/debug/*_universal.apk
          if-no-files-found: error
