name: Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build beta debug APK
        run: ./gradlew assembleStbetaDebug --stacktrace

      - name: Build stable debug APK
        run: ./gradlew assembleStstableDebug --stacktrace

      - name: Upload beta debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-beta-debug
          path: smarttubetv/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload stable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-stable-debug
          path: smarttubetv/build/outputs/apk/**/*.apk
          if-no-files-found: error
