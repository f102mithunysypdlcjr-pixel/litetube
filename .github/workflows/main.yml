name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    name: Build Signed Stable Release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 14
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '14'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Generate signing key
        run: |
          set -e
          PASS=$(openssl rand -hex 16)
          ALIAS="ciupload"

          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/key.jks" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=CI Build, OU=CI, O=CI, L=CI, S=CI, C=US"

          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/key.jks
          storePassword=$PASS
          keyAlias=$ALIAS
          keyPassword=$PASS
          EOF

          echo "::add-mask::$PASS"

      - name: Verify signing key is actually decryptable
        run: |
          set -e
          STOREPASS=$(grep '^storePassword=' "$GITHUB_WORKSPACE/keystore.properties" | cut -d= -f2-)
          KEYALIAS=$(grep '^keyAlias=' "$GITHUB_WORKSPACE/keystore.properties" | cut -d= -f2-)

          keytool -certreq \
            -alias "$KEYALIAS" \
            -keystore "$GITHUB_WORKSPACE/key.jks" \
            -storepass "$STOREPASS" \
            -keypass "$STOREPASS" \
            -file /tmp/csr.pem

          echo "Private key IS decryptable — proceeding to build."

      - name: Build signed Stable Release APK
        run: ./gradlew clean assembleStstableRelease --stacktrace --max-workers=1

      - name: Find generated APK
        run: |
          echo "Generated APK:"
          find smarttubetv/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: litetube-stable-release
          path: smarttubetv/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Delete signing key
        if: always()
        run: rm -f key.jks keystore.properties
