name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Stable Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 14
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '14'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > key.jks

      - name: Build signed Stable Release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          ./gradlew clean assembleStstableRelease \
            -PstoreFile="$GITHUB_WORKSPACE/key.jks" \
            -PstorePassword="$KEY_STORE_PASSWORD" \
            -PkeyAlias="$ALIAS" \
            -PkeyPassword="$KEY_PASSWORD" \
            --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK:"
          find smarttubetv/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: litetube-stable-release
          path: smarttubetv/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Delete signing key
        if: always()
        run: rm -f key.jks
